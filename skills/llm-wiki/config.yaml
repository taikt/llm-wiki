# ── LLM Wiki Config ──────────────────────────────────────────────────────────
# Edit the values below to match your machine.
#
# converter: markitdown (default, fast) | docling (better for scanned PDFs)
# projects: list of wiki projects

converter: markitdown

projects:
  - name: default
    root: /path/to/your/wiki-root       # ← EDIT THIS!
    description: Your main wiki
